name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write production env
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        run: printf '%s\n' "$PRODUCTION_ENV" > .env.production

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run github-build
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Assemble standalone release
        run: |
          set -euo pipefail
          test -f .next/standalone/server.js
          cp -r public .next/standalone/
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          rm -f .next/standalone/.env .next/standalone/.env.*
          tar -czf release.tar.gz -C .next/standalone .

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release

      - name: Report release
        run: |
          set -euo pipefail
          ls -lh release.tar.gz
          sha256sum release.tar.gz

      - name: Install coscli
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/tencentyun/coscli/releases/download/v1.0.9/coscli-v1.0.9-linux-amd64 -o /tmp/coscli
          sudo install -m 755 /tmp/coscli /usr/local/bin/coscli
          coscli --version

      - name: Configure coscli
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
        run: |
          set -euo pipefail
          cat > "$HOME/.cos.yaml" <<EOF
          cos:
            base:
              secretid: "${COS_SECRET_ID}"
              secretkey: "${COS_SECRET_KEY}"
              sessiontoken: ""
              protocol: https
              disableencryption: "true"
            buckets:
              - name: "${COS_BUCKET}"
                alias: deploy
                region: "${COS_REGION}"
                endpoint: cos.accelerate.myqcloud.com
                ofs: false
          EOF

      - name: Upload release to COS
        id: cos
        env:
          COS_REGION: ${{ vars.COS_REGION }}
        run: |
          set -euo pipefail
          KEY="releases/${{ github.run_number }}-${{ github.sha }}.tar.gz"
          SHA256="$(sha256sum release.tar.gz | awk '{print $1}')"
          echo "key: $KEY"
          echo "size: $(du -h release.tar.gz | cut -f1)"
          echo "sha256: $SHA256"

          time coscli cp release.tar.gz "cos://deploy/$KEY" \
            --thread-num 8 --part-size 8 --fail-output=false

          # 默认域名在服务器同地域会解析到内网，下载不计外网流量。
          URL="$(coscli signurl "cos://deploy/$KEY" --time 3600 --simple-output -e "cos.${COS_REGION}.myqcloud.com")"
          echo "::add-mask::$URL"
          {
            echo "key=$KEY"
            echo "sha256=$SHA256"
            echo "url=$URL"
          } >> "$GITHUB_OUTPUT"

      - name: Activate release
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT || '22' }}
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail
            BASE="${{ vars.DEPLOY_PATH }}"
            SERVICE="${{ vars.DEPLOY_SERVICE || 'app' }}"
            PORT="${{ vars.APP_PORT || '3000' }}"
            RELEASE="$(date -u +%Y%m%d%H%M%S)-${{ github.sha }}"

            mkdir -p "$BASE/incoming" "$BASE/releases/$RELEASE"
            curl -fL --retry 3 --retry-delay 2 -o "$BASE/incoming/release.tar.gz" '${{ steps.cos.outputs.url }}'
            echo '${{ steps.cos.outputs.sha256 }}  '"$BASE/incoming/release.tar.gz" | sha256sum -c -
            tar -xzf "$BASE/incoming/release.tar.gz" -C "$BASE/releases/$RELEASE"
            rm -f "$BASE/incoming/release.tar.gz"

            ln -sfn "$BASE/releases/$RELEASE" "$BASE/current"
            sudo systemctl restart "$SERVICE"

            for _ in $(seq 1 20); do
              if curl -fsS "http://127.0.0.1:$PORT/" >/dev/null; then
                break
              fi
              sleep 3
            done
            curl -fsS "http://127.0.0.1:$PORT/" >/dev/null

            ls -1dt "$BASE"/releases/* 2>/dev/null | tail -n +6 | xargs -r rm -rf
